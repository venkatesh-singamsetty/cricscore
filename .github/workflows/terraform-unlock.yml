name: Terraform Force Unlock

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to unlock"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      lock_id:
        description: "The Terraform Lock ID to force unlock (e.g., e-12345678-abcd)"
        required: true
        type: string

permissions:
  id-token: write # needed for AWS OIDC authentication
  contents: read

jobs:
  force-unlock:
    name: Force Unlock Terraform State
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ (vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN) == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ (vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN) == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init & Force Unlock
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'venky-2026-terraform-state' }}
        working-directory: infra/terraform
        run: |
          echo "Initializing Terraform backend for environment: ${{ inputs.environment }}"
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=cricscore/${{ inputs.environment }}/terraform.tfstate"

          echo "Executing Force Unlock for Lock ID: ${{ inputs.lock_id }}"
          terraform force-unlock -force "${{ inputs.lock_id }}"
