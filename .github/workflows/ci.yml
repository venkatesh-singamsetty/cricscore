name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  AWS_REGION: us-east-1

jobs:


  validate_security:
    name: Infrastructure & Secrets Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run GitLeaks Secrets Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform

  validate_frontend:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - name: TypeScript type-check & lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Run unit tests
        working-directory: apps/frontend
        run: npm run test
      - name: Build production bundle (Dry-Run)
        working-directory: apps/frontend
        run: npm run build

  validate_backend:
    name: Backend & Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/backend/lambdas/*/package-lock.json
      - name: Install Lambda dependencies
        run: |
          set -e
          (cd apps/backend && npm install --no-audit --no-fund --ignore-scripts)
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund --ignore-scripts)
            fi
          done
      - name: Run Backend Unit Tests
        env:
          LLM_API_KEY: "dummy"
          OPENAI_API_KEY: "dummy"
        run: |
          cd apps/backend
          npm test
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/lambdas'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.10'
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: infra/terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform

  validate_python:
    name: Python AI & ML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/ai-service/requirements.txt
            apps/ml-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install -r apps/ml-engine/requirements.txt

      - name: Run Python AI Service Tests
        run: pytest apps/ai-service -q

      - name: Run Python ML Engine Tests
        run: pytest apps/ml-engine/test_predict.py -q

      - name: Run Trivy vulnerability scanner on Python
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "apps/ai-service"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  deploy_and_test_dev:
    name: Deploy, Test & OWASP ZAP DEV
    needs: [validate_frontend, validate_backend, validate_security, validate_python]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      issues: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'venky-2026-terraform-state' }}
      TF_VAR_environment: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_zone_domain: ${{ vars.ZONE_DOMAIN }}
      TF_VAR_subdomain_prefix: ${{ vars.SUBDOMAIN_PREFIX }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_ses_source_email: ${{ secrets.TF_SES_SOURCE_EMAIL }}
      TF_VAR_database_url: ${{ secrets.TF_DATABASE_URL }}
      TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
      TF_VAR_llm_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_llm_base_url: ${{ vars.LLM_BASE_URL }}
      TF_VAR_llm_model: ${{ vars.LLM_MODEL }}
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate AWS_REGION secret
        run: |
          if [ -z "$AWS_REGION" ]; then echo "Missing AWS_REGION. Set vars.AWS_REGION"; exit 1; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Database Migrations
        run: |
          cd infra/database
          chmod +x migrate.sh
          ./migrate.sh "${{ secrets.TF_DATABASE_URL }}" "dev"

      # --- BACKEND DEPLOYMENT ---
      - name: Install Lambda dependencies
        run: |
          set -e
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --omit=dev --no-audit --no-fund --ignore-scripts)
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=cricscore/dev/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -var-file="environments/dev.tfvars" -var="domain_name=$TF_VAR_domain_name" -var="zone_domain=$TF_VAR_zone_domain" -var="subdomain_prefix=$TF_VAR_subdomain_prefix" -var="project_name=$TF_VAR_project_name" -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        working-directory: infra/terraform
        run: |
          echo "COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> $GITHUB_ENV
          echo "COGNITO_DOMAIN=$(terraform output -raw cognito_domain)" >> $GITHUB_ENV
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV

      - name: Install Frontend dependencies
        working-directory: apps/frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build production bundle
        working-directory: apps/frontend
        env:
          VITE_APP_TITLE: CricScoreDev
          VITE_API_URL: https://api.${{ vars.DOMAIN_NAME }}
          VITE_WS_URL: wss://ws.${{ vars.DOMAIN_NAME }}
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
        run: |
          export VITE_COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID"
          export VITE_COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID"
          export VITE_COGNITO_DOMAIN="$COGNITO_DOMAIN"
          npm run build

      - name: Upload build to S3
        run: |
          aws s3 sync apps/frontend/dist/ "s3://${S3_BUCKET}/" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp apps/frontend/dist/index.html "s3://${S3_BUCKET}/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: Run AI chat evaluation against deployed API
        env:
          CHAT_API_URL: https://api.${{ vars.DOMAIN_NAME }}
        run: |
          npm run test:ai -- --url "$CHAT_API_URL" --limit 4

      # --- E2E TESTS ---
      - name: Install E2E dependencies
        working-directory: ./apps/e2e
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Install Playwright Browsers
        working-directory: ./apps/e2e
        run: npx playwright install --with-deps

      - name: Run Playwright tests against DEV
        working-directory: ./apps/e2e
        env:
          BASE_URL: https://${{ vars.DOMAIN_NAME }}
          API_URL: https://api.${{ vars.DOMAIN_NAME }}
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-dev
          path: apps/e2e/playwright-report/

      # --- DAST SCAN ---
      - name: Fix workspace permissions for ZAP Docker
        run: chmod -R 777 ${{ github.workspace }}

      - name: Run OWASP ZAP Baseline Scan against DEV
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://${{ vars.DOMAIN_NAME }}"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false
