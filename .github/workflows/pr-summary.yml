name: PR Summary Generator

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Structured PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Categorize changed files
            const frontend = files.filter(f => f.filename.startsWith('apps/frontend/'));
            const backend = files.filter(f => f.filename.startsWith('apps/backend/'));
            const infra = files.filter(f => f.filename.startsWith('infra/'));
            const docs = files.filter(f => f.filename.startsWith('docs/') || f.filename.endsWith('.md'));
            const cicd = files.filter(f => f.filename.startsWith('.github/'));

            let summary = `### 🤖 Automated PR Summary & Change Matrix\n\n`;
            summary += `| Component | Status | Changed Files |\n`;
            summary += `| :--- | :--- | :--- |\n`;
            summary += `| 🎨 **Frontend App** | ${frontend.length > 0 ? '📝 Modified (' + frontend.length + ' files)' : '➖ Unchanged'} | ${frontend.length} |\n`;
            summary += `| ⚡ **Backend & Lambdas** | ${backend.length > 0 ? '📝 Modified (' + backend.length + ' files)' : '➖ Unchanged'} | ${backend.length} |\n`;
            summary += `| 🏗️ **Terraform IaC** | ${infra.length > 0 ? '📝 Modified (' + infra.length + ' files)' : '➖ Unchanged'} | ${infra.length} |\n`;
            summary += `| 📚 **Documentation** | ${docs.length > 0 ? '📝 Modified (' + docs.length + ' files)' : '➖ Unchanged'} | ${docs.length} |\n`;
            summary += `| ⚙️ **CI/CD & Workflows** | ${cicd.length > 0 ? '📝 Modified (' + cicd.length + ' files)' : '➖ Unchanged'} | ${cicd.length} |\n\n`;

            summary += `#### 📜 Commits Included in this PR:\n`;
            commits.forEach(c => {
              const msg = c.commit.message.split('\n')[0];
              summary += `- \`${c.sha.substring(0, 7)}\` ${msg}\n`;
            });

            summary += `\n---\n*Automated PR Summary generated by CricScore CI/CD Pipeline.*`;

            // Check if comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Automated PR Summary'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: summary,
              });
            }
