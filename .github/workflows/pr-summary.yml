name: PR Summary Generator

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  summarize:
    name: Auto-Generate PR Description Body
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-Populate PR Description Body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Fetch changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Fetch commits
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Clean commit headline helper
            function cleanMsg(msg) {
              let clean = msg.replace(/^(feat|fix|docs|ci|chore|refactor|test|style)(\([^)]+\))?:\s*/i, '');
              return clean.charAt(0).toUpperCase() + clean.slice(1);
            }

            // Extract unique cleaned commit messages per type
            const commitMsgs = commits.map(c => c.commit.message.split('\n')[0]);
            
            const feats = [...new Set(commitMsgs.filter(m => /^feat/i.test(m)).map(cleanMsg))];
            const fixes = [...new Set(commitMsgs.filter(m => /^fix/i.test(m)).map(cleanMsg))];
            const docs = [...new Set(commitMsgs.filter(m => /^docs/i.test(m)).map(cleanMsg))];
            const cis = [...new Set(commitMsgs.filter(m => /^(ci|chore\(ci\))/i.test(m)).map(cleanMsg))];
            const chores = [...new Set(commitMsgs.filter(m => /^(chore|refactor|style)/i.test(m) && !/^chore\(ci\)/i.test(m)).map(cleanMsg))];

            // Categorize changed files
            const frontend = files.filter(f => f.filename.startsWith('apps/frontend/'));
            const backend = files.filter(f => f.filename.startsWith('apps/backend/'));
            const infra = files.filter(f => f.filename.startsWith('infra/'));
            const docFiles = files.filter(f => f.filename.startsWith('docs/') || f.filename.endsWith('.md'));
            const cicd = files.filter(f => f.filename.startsWith('.github/'));

            // Build dynamic high-level description
            const domains = [];
            if (frontend.length > 0) domains.push('Frontend App');
            if (backend.length > 0) domains.push('Backend Lambdas');
            if (infra.length > 0) domains.push('Terraform Infrastructure');
            if (docFiles.length > 0) domains.push('Documentation');
            if (cicd.length > 0) domains.push('CI/CD Pipelines');

            let body = `## Description\n`;
            body += `This Pull Request updates **${domains.join(', ')}** based on **${commits.length} commit(s)** across **${files.length} changed file(s)**.\n\n`;

            body += `## Key Changes Included\n`;
            if (feats.length > 0) {
              body += `- 🚀 **Features & Enhancements**:\n` + feats.map(m => `  - ${m}`).join('\n') + `\n`;
            }
            if (fixes.length > 0) {
              body += `- 🐛 **Bug Fixes**:\n` + fixes.map(m => `  - ${m}`).join('\n') + `\n`;
            }
            if (docs.length > 0 || docFiles.length > 0) {
              const list = docs.length > 0 ? docs : [`Updated ${docFiles.length} documentation files`];
              body += `- 📚 **Documentation & Guides**:\n` + list.map(m => `  - ${m}`).join('\n') + `\n`;
            }
            if (cis.length > 0 || cicd.length > 0) {
              const list = cis.length > 0 ? cis : [`Configured ${cicd.length} pipeline files`];
              body += `- 🛡️ **Governance & CI/CD Pipelines**:\n` + list.map(m => `  - ${m}`).join('\n') + `\n`;
            }
            if (chores.length > 0) {
              body += `- 🧰 **Maintenance & Infrastructure Refactoring**:\n` + chores.map(m => `  - ${m}`).join('\n') + `\n`;
            }

            body += `\n## Component Change Matrix\n`;
            body += `| Component | Status | Changed Files |\n`;
            body += `| :--- | :--- | :--- |\n`;
            body += `| 🎨 **Frontend App** | ${frontend.length > 0 ? '📝 Modified (' + frontend.length + ' files)' : '➖ Unchanged'} | ${frontend.length} |\n`;
            body += `| ⚡ **Backend & Lambdas** | ${backend.length > 0 ? '📝 Modified (' + backend.length + ' files)' : '➖ Unchanged'} | ${backend.length} |\n`;
            body += `| 🏗️ **Terraform IaC** | ${infra.length > 0 ? '📝 Modified (' + infra.length + ' files)' : '➖ Unchanged'} | ${infra.length} |\n`;
            body += `| 📚 **Documentation** | ${docFiles.length > 0 ? '📝 Modified (' + docFiles.length + ' files)' : '➖ Unchanged'} | ${docFiles.length} |\n`;
            body += `| ⚙️ **CI/CD & Workflows** | ${cicd.length > 0 ? '📝 Modified (' + cicd.length + ' files)' : '➖ Unchanged'} | ${cicd.length} |\n\n`;

            body += `## Verification Checklist\n`;
            body += `- [x] Code formatting and linters verified (\`npm run lint\`)\n`;
            body += `- [x] Unit test suites executed (\`npm run test:all\`)\n`;
            body += `- [x] Secret scanning verified (\`gitleaks protect -v\`)\n`;
            body += `- [x] Automated CI status checks passing\n\n`;

            body += `---\n*Auto-generated PR Description by CricScore CI/CD Pipeline.*`;

            // Update PR Body directly!
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: body,
            });
