name: Backend & Infrastructure CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'infra/terraform/**'
      - '.github/workflows/backend-infra.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  validate:
    name: Backend & Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js (for packaging check)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Lambda dependencies
        run: |
          set -e
          # Install shared backend dependencies for tests
          (cd apps/backend && npm install --ignore-scripts)
          # Install individual lambda dependencies
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              echo "Installing dependencies in $d"
              (cd "$d" && npm install --ignore-scripts)
            fi
          done
      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          npm test
      - name: Run Trivy vulnerability scanner (fs) on Lambdas
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/lambdas'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.9'
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: infra/terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform
      - name: Run Checkov static analysis on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: results.sarif
          category: checkov

  deploy_dev:
    name: Deploy to DEV
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_environment: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ses_source_email: ${{ secrets.TF_SES_SOURCE_EMAIL }}
      TF_VAR_database_url: ${{ secrets.TF_DATABASE_URL }}
      TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate AWS_REGION secret
        run: |
          if [ -z "$AWS_REGION" ]; then echo "Missing AWS_REGION. Set vars.AWS_REGION"; exit 1; fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up Node.js (for packaging Lambdas)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Lambda dependencies (production only)
        run: |
          set -e
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              echo "Installing production dependencies in $d"
              (cd "$d" && npm install --omit=dev --ignore-scripts)
            fi
          done
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.9'
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend-config="key=cricscore/dev/terraform.tfstate"
      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -var-file="environments/dev.tfvars" -out=tfplan
      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

  e2e_dev:
    name: E2E Tests (DEV)
    needs: deploy_dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install E2E dependencies
        working-directory: ./apps/e2e
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Install Playwright Browsers
        working-directory: ./apps/e2e
        run: npx playwright install --with-deps
      - name: Run Playwright tests against DEV
        working-directory: ./apps/e2e
        env:
          BASE_URL: https://${{ vars.DOMAIN_NAME }}
          API_URL: https://${{ vars.API_GATEWAY_ID }}.execute-api.${{ vars.AWS_REGION }}.amazonaws.com
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-dev
          path: apps/e2e/playwright-report/
          retention-days: 14

  deploy_prod:
    name: Deploy to PROD
    needs: [deploy_dev, e2e_dev]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_environment: prod
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ses_source_email: ${{ secrets.TF_SES_SOURCE_EMAIL }}
      TF_VAR_database_url: ${{ secrets.TF_DATABASE_URL }}
      TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate AWS_REGION secret
        run: |
          if [ -z "$AWS_REGION" ]; then echo "Missing AWS_REGION. Set vars.AWS_REGION"; exit 1; fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up Node.js (for packaging Lambdas)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Lambda dependencies (production only)
        run: |
          set -e
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              echo "Installing production dependencies in $d"
              (cd "$d" && npm install --omit=dev --ignore-scripts)
            fi
          done
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.9'
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend-config="key=cricscore/prod/terraform.tfstate"
      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -var-file="environments/prod.tfvars" -out=tfplan
      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

  e2e_prod:
    name: E2E Tests (PROD)
    needs: deploy_prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install E2E dependencies
        working-directory: ./apps/e2e
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Install Playwright Browsers
        working-directory: ./apps/e2e
        run: npx playwright install --with-deps
      - name: Run Playwright tests against PROD
        working-directory: ./apps/e2e
        env:
          BASE_URL: https://${{ vars.DOMAIN_NAME }}
          API_URL: https://${{ vars.API_GATEWAY_ID }}.execute-api.${{ vars.AWS_REGION }}.amazonaws.com
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-prod
          path: apps/e2e/playwright-report/
          retention-days: 14
