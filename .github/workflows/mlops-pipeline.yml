name: MLOps Pipeline (Live Win Predictor)

on:
  push:
    paths:
      - 'apps/ml-engine/**'
    branches:
      - main
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 0 1 * *' # Run automatically on the 1st of every month to capture new cricket matches

jobs:
  train-and-deploy-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ML Dependencies
        working-directory: apps/ml-engine
        run: pip install -r requirements.txt

      - name: Run Inference Handler Unit Tests
        working-directory: apps/ml-engine
        run: pytest test_predict.py -v

      - name: Download & Parse Data (Phase 1)
        working-directory: apps/ml-engine
        run: python data_pipeline.py

      - name: Train & Evaluate Model (Phase 2 & 3)
        working-directory: apps/ml-engine
        env:
          CI: 'true'
        run: |
          python live_train.py
          
          # Phase 3: Fail workflow if accuracy < 60%
          ACCURACY=$(jq '.metrics.accuracy' live_metadata.json)
          if (( $(echo "$ACCURACY < 0.60" | bc -l) )); then
            echo "❌ Model failed evaluation threshold (Accuracy: $ACCURACY)"
            exit 1
          fi
          echo "✅ Model passed minimum threshold (Accuracy: $ACCURACY)"

      - name: Upload Model Artifact (Phase 4)
        uses: actions/upload-artifact@v4
        with:
          name: live-win-predictor-v1
          path: |
            apps/ml-engine/live_win_predictor_model.joblib
            apps/ml-engine/live_metadata.json
