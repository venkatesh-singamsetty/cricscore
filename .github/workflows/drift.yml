name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  AWS_REGION: us-east-1

jobs:
  drift-check:
    name: Drift Check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            project_name: cricscoredev
            domain_name: cricscoredev.venkateshsingamsetty.com
            subdomain_prefix: cricscoredev
          - environment: prod
            project_name: cricscore
            domain_name: cricscore.venkateshsingamsetty.com
            subdomain_prefix: cricscore
    defaults:
      run:
        working-directory: ./infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/backend/lambdas/*/package-lock.json

      - name: Install Lambda dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for d in apps/backend/lambdas/*; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --omit=dev --no-audit --no-fund --ignore-scripts)
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'venky-2026-terraform-state' }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=cricscore/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform Plan (Detailed Exitcode)
        # -detailed-exitcode returns 0 if no changes, 1 if error, 2 if there are changes (drift)
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_environment: ${{ matrix.environment }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_domain_name: ${{ matrix.domain_name }}
          TF_VAR_zone_domain: ${{ vars.ZONE_DOMAIN || 'venkateshsingamsetty.com' }}
          TF_VAR_subdomain_prefix: ${{ matrix.subdomain_prefix }}
          TF_VAR_project_name: ${{ matrix.project_name }}
          TF_VAR_ses_source_email: ${{ secrets.TF_SES_SOURCE_EMAIL }}
          TF_VAR_database_url: ${{ secrets.TF_DATABASE_URL }}
          TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL || 'venky.2k57@gmail.com' }}
          TF_VAR_llm_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_llm_base_url: ${{ vars.LLM_BASE_URL }}
          TF_VAR_llm_model: ${{ vars.LLM_MODEL }}
        run: terraform plan -input=false -detailed-exitcode -var-file="environments/${{ matrix.environment }}.tfvars" -var="domain_name=$TF_VAR_domain_name" -var="zone_domain=$TF_VAR_zone_domain" -var="subdomain_prefix=$TF_VAR_subdomain_prefix" -var="project_name=$TF_VAR_project_name"

