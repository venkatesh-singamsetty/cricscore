name: Database Keep-Alive & Daily Prod E2E Match

on:
  schedule:
    # Run daily at 12:00 UTC to generate real WAL write activity in Aiven PostgreSQL
    # by playing one full 2-over E2E match in Production and pruning older E2E matches (keeping latest 7).
    - cron: "0 12 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

concurrency:
  group: keepalive-prod-e2e
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  prod-keepalive-e2e:
    name: Daily Prod E2E Match & Retain Latest 7 Test Matches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'cricscore.venkateshsingamsetty.com' }}
      DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
    steps:
      - name: Resolve Production Release Tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Using explicitly dispatched tag: ${{ github.ref_name }}"
            echo "target_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "Targeting latest production release tag: $LATEST_TAG"
              echo "target_ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "No release tag found; falling back to ${{ github.ref }}"
              echo "target_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve-tag.outputs.target_ref }}

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate Database Secret & Wake Aiven PostgreSQL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ TF_DATABASE_URL secret is missing or empty. Please set it in GitHub repo/environment secrets."
            exit 1
          fi
          echo "Pinging Aiven PostgreSQL before starting Production E2E match..."
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if PGCONNECT_TIMEOUT=20 psql "$DATABASE_URL" -c "SET search_path TO prod; SELECT count(*) AS prod_matches FROM matches;" 2>&1; then
              echo "✅ Database connection verified on attempt $i."
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "❌ All 3 database connection attempts failed. Check https://console.aiven.io."
              exit 1
            fi
            echo "⚠️ Attempt $i failed. Waiting 10 seconds before retry..."
            sleep 10
          done

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install E2E dependencies
        working-directory: ./apps/e2e
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/e2e/package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Run 1 Full End-to-End Match in Production
        working-directory: ./apps/e2e
        env:
          BASE_URL: https://${{ env.DOMAIN_NAME }}
          API_URL: https://api.${{ env.DOMAIN_NAME }}
        run: npx playwright test tests/user-journey.spec.ts --project=chromium

      - name: Prune Old E2E Test Matches in Prod (Keep Latest 7 Only)
        if: always()
        run: |
          if [ -z "$DATABASE_URL" ]; then
            exit 0
          fi
          echo "🧹 Cleaning old E2E test matches in prod schema (retaining latest 7 E2E matches)..."
          PGCONNECT_TIMEOUT=20 psql "$DATABASE_URL" << 'SQL'
          SET search_path TO prod;
          WITH ranked_e2e AS (
            SELECT id, team_a_name, team_b_name, created_at
            FROM matches
            WHERE is_test = TRUE
               OR team_a_name ILIKE '%test%'
               OR team_b_name ILIKE '%test%'
               OR team_a_name ILIKE '%sync%'
               OR team_b_name ILIKE '%sync%'
               OR team_a_name ILIKE 'TEAM A%'
               OR team_b_name ILIKE 'TEAM B%'
               OR scorer_email LIKE 'test-%'
            ORDER BY created_at DESC
            OFFSET 7
          )
          DELETE FROM matches
          WHERE id IN (SELECT id FROM ranked_e2e)
          RETURNING id, team_a_name, team_b_name, created_at;

          SELECT count(*) AS remaining_e2e_matches
          FROM matches
          WHERE is_test = TRUE
             OR team_a_name ILIKE '%test%'
             OR team_b_name ILIKE '%test%'
             OR team_a_name ILIKE '%sync%'
             OR team_b_name ILIKE '%sync%'
             OR team_a_name ILIKE 'TEAM A%'
             OR team_b_name ILIKE 'TEAM B%'
             OR scorer_email LIKE 'test-%';
          SQL

      - name: Upload Playwright Keep-Alive Report (GitHub Artifact)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-keepalive-prod
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Configure AWS Credentials (OIDC)
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Sync Keep-Alive Playwright Report to AWS S3
        if: always()
        run: |
          if [ -d "apps/e2e/playwright-report" ]; then
            BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'cricscore-match-backups-')].Name | [0]" --output text)
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
              echo "📦 Updating keepalive latest Playwright report at s3://${BUCKET}/reports/playwright/keepalive/latest/..."
              aws s3 sync apps/e2e/playwright-report/ "s3://${BUCKET}/reports/playwright/keepalive/latest/" --delete
              echo "✅ Keep-Alive Playwright report successfully synced to S3."
            else
              echo "⚠️ Could not locate cricscore-match-backups bucket in AWS account."
            fi
          fi
