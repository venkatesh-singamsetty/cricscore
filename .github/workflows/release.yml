name: Semantic Release (Manual Override)

# Normal releases are cut automatically by CD (cd.yml -> finalize_release)
# ONLY AFTER production deployment and post-deploy verification pass.
# Keep this workflow for manual release recovery via workflow_dispatch.
on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  release:
    name: Manual Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Semantic Release
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/changelog conventional-changelog-conventionalcommits
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Enrich Latest GitHub Release Notes
        if: success()
        run: ./infra/scripts/enrich_release_notes.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
